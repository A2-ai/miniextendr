name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/**'
      - '*/src/**'
      - 'rpkg/src/rust/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The root rust-toolchain.toml (#1243) pins the repo to stable, and a
    # toolchain file outranks the `rustup default nightly` that
    # dtolnay/rust-toolchain@nightly sets below — so cargo resolved to stable
    # and rejected the -Z flags ("-Z ... only accepted on the nightly
    # channel"). This job's rustdoc builds need nightly (-Z rustdoc-map,
    # -Z unstable-options), so override the toolchain file explicitly:
    # RUSTUP_TOOLCHAIN sits above it in rustup's resolution order.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7

      # miniextendr-api/build.rs calls `R RHOME` to resolve libR for linking.
      # Rustdoc-only builds don't link — build.rs just has to not panic, and
      # its `r_home` existence check accepts any valid directory. Dummy with
      # $RUNNER_TEMP (same pattern as dvs2's CI). Must be set from a step —
      # the `runner` context is not available in job-level `env:`.
      - name: Set dummy R_HOME
        run: echo "R_HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@nightly

      - name: Build rustdoc (workspace crates)
        env:
          RUSTFLAGS: --cfg=docsrs
          RUSTDOCFLAGS: >-
            --cfg=docsrs
            -D warnings
            -Z unstable-options
            --document-private-items
            --document-hidden-items
            --show-type-layout
            --enable-index-page
            --generate-link-to-definition
            --generate-macro-expansion
        run: cargo doc --no-deps -Z rustdoc-map -p miniextendr-api -p miniextendr-macros -p miniextendr-lint -p miniextendr-engine

      # rpkg/src/rust is its own workspace, and its Cargo.lock pins the
      # framework crates to an older git commit. Patch them to the crates in
      # this checkout, as `just clippy-rpkg` / `just test-rpkg` do, so the docs
      # describe the commit being deployed and need no configure or vendoring.
      # Building into the workspace's target dir with --enable-index-page (as
      # `just doc-all` does) adds the crate to the same crate index, search
      # index and source pages.
      - name: Build rustdoc (rpkg)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          RUSTFLAGS: --cfg=docsrs
          RUSTDOCFLAGS: >-
            --cfg=docsrs
            -D warnings
            -Z unstable-options
            --document-private-items
            --document-hidden-items
            --show-type-layout
            --enable-index-page
            --generate-link-to-definition
            --generate-macro-expansion
        run: |
          cargo doc --no-deps -Z rustdoc-map --manifest-path rpkg/src/rust/Cargo.toml \
            --config "patch.'https://github.com/A2-ai/miniextendr'.miniextendr-api.path=\"$GITHUB_WORKSPACE/miniextendr-api\"" \
            --config "patch.'https://github.com/A2-ai/miniextendr'.miniextendr-macros.path=\"$GITHUB_WORKSPACE/miniextendr-macros\"" \
            --config "patch.'https://github.com/A2-ai/miniextendr'.miniextendr-lint.path=\"$GITHUB_WORKSPACE/miniextendr-lint\""

      - name: Install Zola
        run: |
          ZOLA_VERSION="0.22.1"
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin/

      - name: Generate manual from docs/
        run: bash scripts/docs-to-site.sh

      - name: Generate roadmap data (issues)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data
          gh issue list --state open --limit 500 \
            --json number,title,labels,url,createdAt,updatedAt,assignees,state \
            > site/data/issues.json

      - name: Build Zola site
        run: cd site && zola build

      - name: Copy rustdoc into site
        run: |
          cp -r target/doc site/public/rustdoc
          rm -f site/public/rustdoc/.lock

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Fix permissions
        run: |
          chmod -c -R +rX "site/public" | while read -r line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One action that asks the Pages API to publish the artifact `build`
    # uploaded; nothing is built here, so ubuntu-slim is enough.
    runs-on: ubuntu-slim
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
