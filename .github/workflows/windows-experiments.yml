name: Windows experiments

# Temporary: characterises the Windows gctorture hang (issue #1800) found while
# getting the Windows R CMD check to run (PR #1783, issue #1654). Runs on PRs
# carrying the `windows` label only. Delete once the cause is recorded.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  experiment:
    name: gctorture timing
    runs-on: windows-latest
    timeout-minutes: 90
    if: contains(github.event.pull_request.labels.*.name, 'windows')
    defaults:
      run:
        shell: C:\rtools45\usr\bin\bash.exe -e -o pipefail {0}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CARGO_PROFILE: dev
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          rtools-version: "45"
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: rpkg
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rpkg/src/rust -> ../../rust-target
          cache-targets: false
          shared-key: r-windows-exp-clean-dev
          cache-on-failure: true

      - name: Configure Windows environment
        run: |
          rtools_home="/c/rtools45"
          echo "${rtools_home}/x86_64-w64-mingw32.static.posix/bin" >> "$GITHUB_PATH"
          echo "${rtools_home}/usr/bin" >> "$GITHUB_PATH"
          echo "$(cygpath -u "$(Rscript.exe -e 'cat(R.home())')")/bin/x64" >> "$GITHUB_PATH"
          if [ -n "${CARGO_HOME:-}" ]; then
            echo "$(cygpath -u "$CARGO_HOME")/bin" >> "$GITHUB_PATH"
          fi

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-revendor
        run: cargo install --path cargo-revendor

      - name: Configure and vendor
        run: |
          just configure
          just vendor

      - name: Build and install the tarball
        run: |
          mkdir -p /tmp/exp-lib
          R CMD build --no-manual rpkg
          R CMD INSTALL --library="$(cygpath -m /tmp/exp-lib)" miniextendr_*.tar.gz

      # No testthat: does a bare fixture call finish under gctorture, and how
      # long does it take as the torture interval grows?
      - name: Time the gctorture fixtures without testthat
        run: |
          lib="$(cygpath -m /tmp/exp-lib)"
          run() { # name, R code
            SECONDS=0
            timeout 120 env R_LIBS="$lib" Rscript -e "$2" > "/tmp/t-$1.log" 2>&1 && rc=0 || rc=$?
            echo "TIMING $1 exit=$rc elapsed=${SECONDS}s"
            grep -v '^\s*$' "/tmp/t-$1.log" | tail -3 | sed 's/^/    | /' || true
          }
          run baseline 'library(miniextendr); n <- miniextendr:::gc_stress_borrowed_rows(); cat("n =", n, "\n")'
          for step in 1000 100 10 1; do
            run "borrowed-step$step" "library(miniextendr); gctorture2($step); n <- miniextendr:::gc_stress_borrowed_rows(); gctorture2(0); cat('n =', n, '\n')"
          done
          for step in 1000 100 10 1; do
            run "wrap-step$step" "library(miniextendr); f <- WrapFactory\$new(); gctorture2($step); b <- f\$build(3L, 4L); d <- b\$dimensions(); c2 <- WrapBoard\$WrapBoardFactory\$copy_board(b)\$dimensions(); gctorture2(0); print(d); print(c2)"
          done

      # Reporter effect: the same body through testthat, with the Windows skips
      # in the test files bypassed by calling the body directly.
      - name: Gctorture body under each testthat reporter
        run: |
          lib="$(cygpath -m /tmp/exp-lib)"
          for rep in silent location check; do
            SECONDS=0
            timeout 120 env R_LIBS="$lib" Rscript -e "
              library(testthat); library(miniextendr)
              testthat::with_reporter('$rep', {
                test_that('borrowed rows under torture', {
                  old <- gctorture(TRUE); on.exit(gctorture(old), add = TRUE)
                  expect_equal(miniextendr:::gc_stress_borrowed_rows(), 10L)
                })
              })" > "/tmp/r-$rep.log" 2>&1 && rc=0 || rc=$?
            echo "REPORTER $rep exit=$rc elapsed=${SECONDS}s"
            grep -v '^\s*$' "/tmp/r-$rep.log" | tail -3 | sed 's/^/    | /' || true
          done
