name: miri nightly

# INFORMATIONAL nightly Miri run for miniextendr-api (#202).
#
# Runs the unit tests of the Arrow R-backed buffer registry
# (`optionals::arrow_impl::r_backed_buffers::tests`) with ordinary Rust
# buffers. They call the production `RBackedBuffers` map, not a `cfg(miri)`
# substitute: a lookup must never read memory the buffer does not own and
# never dereference the recorded SEXP address. Arrow is in no `cargo test` CI
# job, so this is also where these tests run at all.
#
# Deliberately INFORMATIONAL and NOT on the pull_request / push matrix:
#   * It never runs on PRs, so it can never block a merge.
#   * The `cargo miri test` step is `continue-on-error: true` and its outcome is
#     surfaced in the job summary rather than failing the workflow.
#   * Do NOT add this workflow to branch-protection required checks.
# Scheduled nightly plus a manual `workflow_dispatch` for on-demand verification.

on:
  # 04:30 UTC daily — offset from gctorture-nightly (04:00) and the weekly CI
  # cron (Sat 06:00) so the scheduled jobs never contend for runner capacity.
  schedule:
    - cron: '30 4 * * *'
  # Manual trigger to run the tests on demand (e.g. to validate this workflow,
  # or after changing the buffer registry) without waiting for the cron.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miri:
    name: Miri (informational) / Arrow buffer registry
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # miniextendr-api/build.rs calls `R RHOME` (or reads $R_HOME) to resolve
      # libR for LINK time. Miri interprets the test's MIR and never links a real
      # binary, and the registry tests touch no R symbols — so a dummy R_HOME
      # satisfies build.rs's existence check without installing R (same trick as
      # ci.yml's rust-lint / check-features jobs).
      - name: Set dummy R_HOME
        run: echo "R_HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install Rust nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri-nightly
          cache-on-failure: true

      # Sets up Miri's sysroot once (cargo miri test would otherwise do it
      # implicitly on first run; doing it explicitly keeps the run step's output
      # focused on the test).
      - name: Miri setup
        run: cargo +nightly miri setup

      # Minimal feature surface (`--no-default-features` drops `doc-lint`, then
      # `arrow` for the registry) and `--lib` so only the crate's unit tests
      # build. The name filter runs just the registry tests: the rest of the
      # suite calls R or walks linkme #[distributed_slice] tables, neither of
      # which Miri can execute.
      - name: Miri test (Arrow buffer registry)
        id: miri
        continue-on-error: true
        run: >-
          cargo +nightly miri test -p miniextendr-api --no-default-features --features arrow --lib
          -- r_backed_buffers::tests 2>&1 | tee "$RUNNER_TEMP/miri.log"
        shell: bash

      - name: Surface Miri outcome in job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Miri (informational): Arrow buffer registry"
            echo ""
            echo "Outcome: \`${{ steps.miri.outcome }}\`"
            echo ""
            if [ "${{ steps.miri.outcome }}" != "success" ]; then
              echo "The Arrow buffer registry tests failed under Miri. Inspect the"
              echo "log for an invalid buffer access or a pointer-provenance violation"
              echo "in miniextendr-api/src/optionals/arrow_impl/r_backed_buffers.rs."
              echo ""
            fi
            if [ -f "$RUNNER_TEMP/miri.log" ]; then
              echo '```'
              tail -n 80 "$RUNNER_TEMP/miri.log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
