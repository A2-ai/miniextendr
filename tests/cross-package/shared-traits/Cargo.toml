[package]
name = "shared-traits"
version = "0.1.0"
edition = "2021"
publish = false

# Make this a standalone workspace (prevents inheriting from parent)
[workspace]

[lib]
path = "src/lib.rs"

# The declaring crate's class never reaches R: a trait method's argument
# errors take the implementing package's classes (consumer.pkg's
# test-error-classes.R checks that none of these appear).
[package.metadata.miniextendr]
conversion_error_class = ["shared_traits_error_argument", "shared_traits_error"]

[dependencies]
miniextendr-api = { path = "../../../miniextendr-api" , version = "*" }

# Redirect transitive crates.io lookups to local workspace crates.
[patch.crates-io]
miniextendr-api = { path = "../../../miniextendr-api" }
miniextendr-macros = { path = "../../../miniextendr-macros" }
