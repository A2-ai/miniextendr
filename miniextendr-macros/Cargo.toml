[package]
name = "miniextendr-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Procedural macros for miniextendr - Rust bindings for R"
documentation = "https://docs.rs/miniextendr-macros"

[lib]
proc-macro = true

[features]
doc-lint = []
vctrs = []
## Project-wide defaults for #[miniextendr] options.
## Enable via Cargo.toml features to apply to all functions/impl blocks.
## Individual items can opt out with no_strict, no_coerce, preconditions, etc.
strict-default = []
coerce-default = []
r6-default = []
s7-default = []
worker-default = []
## Drop the R-side type checks (`no_preconditions`) by default for all
## #[miniextendr] functions and impl blocks. Individual items keep them with
## `#[miniextendr(preconditions)]`.
## Orthogonal to strict-default and coerce-default (not a mutex pair).
no-preconditions-default = []

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
trybuild = "1.0"
insta = "1"
# `either`: the UI tests cover `match_arg` / `choices` parameters on `Either<T, R>`.
miniextendr-api = { workspace = true, features = ["either"] }
